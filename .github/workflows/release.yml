# Builds Kronos Plus on GitHub's own Windows machine and attaches the zip to the release,
# so anyone can see the download was made from the code in this repo.
name: Build release

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install
        run: pip install -r requirements.txt

      - name: Build
        run: python build_exe.py

      - name: Attach zip to the release
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ github.event.release.tag_name }}" (Get-ChildItem dist\*.zip).FullName --clobber

      - name: Keep the zip as a build artifact
        uses: actions/upload-artifact@v4
        with:
          name: kronos-plus
          path: dist/*.zip
